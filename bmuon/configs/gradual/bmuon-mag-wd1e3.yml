# BMuon-mag: BMuon, budget annealed in every phase to the next pruning level (first half of the
# phase, then held), channels ranked by coupled magnitude, allocation reset to 1 after each pruning.
# Post-training reference: mp1-bmuon-wd1e3 (same settings, global budget 0.3, no gradual pruning).
base_config: base.yml
optimizer: "bmuon"
out_dir: "bmuon/runs/mp1-gradual-bmuon-mag-wd1e3"
gradual:
  score: "magnitude"
  anneal_budget: true
