# Size-matched baseline: small model trained from scratch, uniform channel shrink to 0.138 of the
# full Nequix-MP-1 paths cost (gradual level: 90 % removed (smallest uniform shrink with the full-model proportions)).
# Same recipe as the uniform-shrink baseline (Muon, wd 0.001, 100 epochs), from scratch.
base_config: ../nequix-mp-1-uniform-wd1e3.yml
hidden_irreps: "4x0e + 2x1o + 1x2e + 1x3o"
out_dir: "bmuon/runs/mp1-uniform-c14-wd1e3"
save_every_steps: 1000
snapshot_every_epochs: 5
