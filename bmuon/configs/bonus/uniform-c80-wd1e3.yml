# Size-matched baseline: small model trained from scratch, uniform channel shrink to 0.801 of the
# full Nequix-MP-1 paths cost (gradual level: 20 % removed).
# Same recipe as the uniform-shrink baseline (Muon, wd 0.001, 100 epochs), from scratch.
base_config: ../nequix-mp-1-uniform-wd1e3.yml
hidden_irreps: "100x0e + 49x1o + 25x2e + 25x3o"
out_dir: "bmuon/runs/mp1-uniform-c80-wd1e3"
save_every_steps: 1000
snapshot_every_epochs: 5
