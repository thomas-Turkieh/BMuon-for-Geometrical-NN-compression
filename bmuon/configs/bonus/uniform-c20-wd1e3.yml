# Bonus baseline: small model trained from scratch, uniform channel shrink to 20 % of the full
# Nequix-MP-1 paths cost (13x0e + 7x1o + 3x2e + 3x3o -> 0.200, the cost kept at gradual level 0.8).
# 10 % is out of reach by uniform shrink: the 89 species channels entering block 0 alone are 11 %.
# Same recipe as the uniform-shrink baseline (Muon, wd 0.001, 100 epochs), from scratch.
base_config: ../nequix-mp-1-uniform-wd1e3.yml
hidden_irreps: "13x0e + 7x1o + 3x2e + 3x3o"
out_dir: "bmuon/runs/mp1-uniform-c20-wd1e3"
save_every_steps: 1000
snapshot_every_epochs: 5
