# Gradual pruning, paper Sec. 5.2 "BMuon-mag": BMuon whose budget is annealed, in every phase, from the
# surviving channels to the next level (first half of the phase) then held; channels ranked by
# coupled magnitude; allocation reset to 1 after each pruning.
base_config: base.yml
optimizer: "bmuon"
out_dir: "bmuon/runs/fig2-gradual-bmuon-mag"
bmuon:
  alpha: 0.5
  refresh_every: 5
  eps: 1.0e-6
  cost_model: "channel"
gradual:
  prune_after_epochs: [3, 6, 9, 12, 15, 18]  # pruning before epochs 4, 7, 10, 13, 16, 19 (3-epoch phases)
  levels: [0.2, 0.4, 0.55, 0.7, 0.8, 0.9]  # cumulative fraction of type-I channels removed; the snapshot
                                           # at the end of each phase (epochs 6, 9, 12, 15, 18, 24) gives
                                           # one point of the Figure 2 curve (error after recovery)
  min_keep: 1                              # never empty a (block, irrep) group
  score: "magnitude"
  anneal_budget: true
